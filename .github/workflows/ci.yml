name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicelab
          POSTGRES_PASSWORD: voicelab
          POSTGRES_DB: voicelab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://voicelab:voicelab@localhost:5432/voicelab_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-secret-must-be-at-least-32-characters
      WEB_ORIGIN: http://localhost:3000
      ELEVENLABS_DEMO_API_KEY: ci-mock-key
      ELEVENLABS_KEY_ENCRYPTION_SECRET: ci-encryption-secret-32-bytes-min

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
